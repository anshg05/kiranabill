apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// D116: ONE version for the app - app-version.json at the repo root (the web code stamps the same file, vite.config.ts).
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../app-version.json'))

android {
    namespace = "com.kiranavoicebill.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kiranavoicebill.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.versionCode as int
        versionName appVersion.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // D115 (owner, 19 Nov 2026): the real app and the test app "KVB Test" from the same code, installed side by side. The web bundle
    // must be built for the same app (VITE_APP_VARIANT=test for kvbtest; a flavour name may not start with "test") - the app stops at "Wrong build" otherwise.
    flavorDimensions = ["app"]
    productFlavors {
        prod { dimension "app" }
        kvbtest {
            dimension "app"
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
        }
    }
    // D117 (owner, 19 Nov 2026): the release key - its file path and password ONLY from environment variables, which
    // scripts/release-apk.ps1 sets for one build after a hidden prompt. Nothing secret, and no path, is written here.
    signingConfigs {
        release {
            if (System.getenv("KVB_RELEASE_KEYSTORE")) {
                storeFile file(System.getenv("KVB_RELEASE_KEYSTORE"))
                storePassword System.getenv("KVB_RELEASE_STORE_PASSWORD")
                keyAlias "kvb-release"
                keyPassword System.getenv("KVB_RELEASE_STORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// D117: never an unsigned release - a release build without the key's environment variables stops here.
gradle.taskGraph.whenReady { graph ->
    def release = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package)\w*Release/ }
    if (release && !System.getenv("KVB_RELEASE_KEYSTORE")) {
        throw new GradleException("A release build needs the release key: run scripts/release-apk.ps1 (it asks for the password).")
    }
}
