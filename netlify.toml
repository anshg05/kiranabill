# docs/17-MANUAL-TASKS.md M-13's own spec: build command, publish dir.
# functions directory is Netlify's own default (netlify/functions) - stated
# explicitly here anyway so it isn't an implicit assumption.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # D55: build (and spend production-deploy credits) only for a commit whose
  # message contains "[deploy]" - the owner approves every release.
  ignore = "bash scripts/netlify-ignore.sh"

# KB-401 (D67): the browser must re-check the worker script and the manifest on every launch - a fix (or the kill
# switch) can only reach phones if /sw.js is never served stale. (src/pwa/register.ts also passes updateViaCache: "none".)
# D91 (owner, 21 Oct 2026): the public privacy-policy page Google's consent screen needs. /privacy is the static file, as its
# own page (a rewrite, status 200) - never the app shell. (The service worker sends this navigation to the network.)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    # Netlify serves an unknown extension as application/octet-stream (seen on the first alias deploy).
    Content-Type = "application/manifest+json"
