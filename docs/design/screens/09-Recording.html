<style>
body{margin:0}
a{color:#2563D9}a:hover{color:#1F4FA3}
@keyframes kbUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes kbPulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.6);opacity:0}}
@keyframes kbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes kbTwinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes kbBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.kb-up{animation:kbUp .6s cubic-bezier(.2,.7,.2,1) both}.kb-up2{animation:kbUp .6s .12s cubic-bezier(.2,.7,.2,1) both}.kb-up3{animation:kbUp .6s .24s cubic-bezier(.2,.7,.2,1) both}
.kb-float{animation:kbFloat 4.5s ease-in-out infinite}.kb-ring{animation:kbPulse 1.9s ease-out infinite}
.kb-tw{animation:kbTwinkle 2.6s ease-in-out infinite}.kb-bar{transform-origin:center;animation:kbBar 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.kb-up,.kb-up2,.kb-up3,.kb-float,.kb-ring,.kb-tw,.kb-bar{animation:none}}
@keyframes kbShimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes kbPrint{from{max-height:0}to{max-height:520px}}
@keyframes kbPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes kbSlide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes kbBlink{0%,100%{opacity:1}50%{opacity:.25}}
.kb-shim{background:linear-gradient(90deg,#EFEBE3 0px,#F8F6F1 60px,#EFEBE3 120px);background-size:400px 100%;animation:kbShimmer 1.4s linear infinite}
.kb-print{overflow:hidden;animation:kbPrint 2.4s ease-out both}
.kb-pop{animation:kbPop .6s cubic-bezier(.2,.8,.2,1.2) both}
.kb-s1{animation:kbSlide .45s .05s both}.kb-s2{animation:kbSlide .45s .15s both}.kb-s3{animation:kbSlide .45s .25s both}.kb-s4{animation:kbSlide .45s .35s both}
.kb-blink{animation:kbBlink 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.kb-shim,.kb-print,.kb-pop,.kb-s1,.kb-s2,.kb-s3,.kb-s4,.kb-blink{animation:none}}
</style>
