<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2563D9}a:hover{color:#1F4FA3}
@keyframes kbUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes kbPulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.6);opacity:0}}
@keyframes kbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes kbTwinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes kbBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.kb-up{animation:kbUp .6s cubic-bezier(.2,.7,.2,1) both}.kb-up2{animation:kbUp .6s .12s cubic-bezier(.2,.7,.2,1) both}.kb-up3{animation:kbUp .6s .24s cubic-bezier(.2,.7,.2,1) both}
.kb-float{animation:kbFloat 4.5s ease-in-out infinite}.kb-ring{animation:kbPulse 1.9s ease-out infinite}
.kb-tw{animation:kbTwinkle 2.6s ease-in-out infinite}.kb-bar{transform-origin:center;animation:kbBar 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.kb-up,.kb-up2,.kb-up3,.kb-float,.kb-ring,.kb-tw,.kb-bar{animation:none}}
@keyframes kbSpin{to{transform:rotate(360deg)}}
@keyframes kbSheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes kbPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.kb-spin{animation:kbSpin 1s linear infinite}.kb-sheet{animation:kbSheet .4s cubic-bezier(.2,.8,.2,1) both}.kb-pop{animation:kbPop .6s cubic-bezier(.2,.8,.2,1.2) both}
@media (prefers-reduced-motion: reduce){.kb-spin,.kb-sheet,.kb-pop{animation:none}}
</style>

<style>body{display:flex;justify-content:center;padding:24px;background:#E9E6DF}</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F3; font-family: 'Inter','Noto Sans Devanagari',sans-serif; color: #263238; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 4px"><a href="16-Items.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #263238"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><div style="flex: 1; font-size: 18px; font-weight: 700">Add item</div></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 6px 20px 0; overflow: hidden">

ejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span><button style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1.5px dashed #E7E1D8; background: transparent; color: #2563D9; font-family: 'Inter','Noto Sans Devanagari',sans-serif; font-size: 14px; font-weight: 700"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add name</button></div><div style="font-size: 13px; color: #5F6A74">Helps the app match what you say to this item.</div></div>

<div style="display: flex; flex-direction: column; gap: 6px"><label for="itPrice" style="font-size: 14px; font-weight: 600">Price per kg</label><div style="display: flex; align-items: center; gap: 8px; min-height: 52px; border-radius: 14px; border: 1px solid #E7E1D8; background: #FFFFFF; padding: 0 14px"><span style="color: #5F6A74; font-size: 16px">₹</span><input id="itPrice" value="150" placeholder="" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: 'Inter','Noto Sans Devanagari',sans-serif; font-size: 16px; color: #263238"></div><div style="font-size: 13px; color: #5F6A74">Fills in when you don’t say a price.</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="itPack" style="font-size: 14px; font-weight: 600">Pack size · optional</label><div style="display: flex; align-items: center; gap: 8px; min-height: 52px; border-radius: 14px; border: 1px solid #E7E1D8; background: #FFFFFF; padding: 0 14px"><input id="itPack" value="" placeholder="e.g. 500 g pouch" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: 'Inter','Noto Sans Devanagari',sans-serif; font-size: 16px; color: #263238"></div></div>
</div>
