body{margin:0}
a{color:#2563D9}a:hover{color:#1F4FA3}
@keyframes kbUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes kbPulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.6);opacity:0}}
@keyframes kbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

.kb-tw{animation:kbTwinkle 2.6s ease-in-out infinite}.kb-bar{transform-origin:center;animation:kbBar 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.kb-up,.kb-up2,.kb-up3,.kb-float,.kb-ring,.kb-tw,.kb-bar{animation:none}}
</style>
