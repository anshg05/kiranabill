@media (prefers-reduced-motion: reduce){.kb-up,.kb-up2,.kb-up3,.kb-float,.kb-ring,.kb-tw,.kb-bar{animation:none}}
@keyframes kbSpin{to{transform:rotate(360deg)}}
@keyframes kbSheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes kbPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.kb-spin{animation:kbSpin 1s linear infinite}.kb-sheet{animation:kbSheet .4s cubic-bezier(.2,.8,.2,1) both}.kb-pop{animation:kbPop .6s cubic-bezier(.2,.8,.2,1.2) both}
